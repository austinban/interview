name: Deploy frontend to GitHub Pages

# Deploy-only branch: builds the Vite app in frontend/ and publishes it to
# GitHub Pages. Kept off the submission branch so the PR stays code-only.
on:
  push:
    branches: [gh-pages-deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /interview/
      # GitHub Pages has no SPA rewrite; serving the app shell as 404.html lets
      # deep links (e.g. /interview/collection) resolve client-side on refresh.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
